name: CI/CD - Release status dashboard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test:
    name: Test NodeJS application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker-build:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    needs: app-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t release-status-dashboard:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: release-status-dashboard:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

  terraform-check:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: app-test

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (without backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  deploy:
    name: Run Deployment Script
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - terraform-check

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deployment script
        run: ./deploy.sh
